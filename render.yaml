# ==============================================================================
# Render Infrastructure-as-Code Blueprint (render.yaml)
# Declares:
#   1. Managed PostgreSQL database (Postgres 16)
#   2. Managed Redis instance (Key Value / Queue backing store)
#   3. Dockerized Express Web API (with automatic migrations via preDeployCommand)
#   4. Dockerized BullMQ Background Audit Worker
# ==============================================================================

databases:
  - name: ledger-postgres
    databaseName: ledger_db
    user: postgres
    region: oregon
    plan: free # Change to 'starter' or higher for production SLA and persistent backups
    postgresMajorVersion: 16

services:
  # ----------------------------------------------------------------------------
  # 1. Managed Redis (Key Value Store) for Balance Caching, Rate Limiting & Queue
  # ----------------------------------------------------------------------------
  - type: redis
    name: ledger-redis
    region: oregon
    plan: free # Change to 'starter' for dedicated memory & persistence
    ipAllowList: [] # Restrict network access exclusively to internal Render services
    maxmemoryPolicy: noeviction # Critical for BullMQ: prevents premature eviction of jobs & streams

  # ----------------------------------------------------------------------------
  # 2. Main Web API Service (Node.js / Express inside Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: ledger-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free # Change to 'starter' for zero idle spin-down
    branch: main
    healthCheckPath: /api/v1/health

    # Automatically runs pending migrations on the release container before routing HTTP traffic
    preDeployCommand: node src/database/migrate.js

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

      # Dynamic environment wiring from managed infrastructure
      - key: DATABASE_URL
        fromDatabase:
          name: ledger-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: ledger-redis
          property: connectionString

      # Cryptographically secure 256-bit random keys auto-generated by Render upon provisioning
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # ----------------------------------------------------------------------------
  # 3. Background Audit Worker Process (BullMQ Queue Consumer)
  # ----------------------------------------------------------------------------
  - type: worker
    name: ledger-audit-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node src/worker.js
    region: oregon
    plan: starter # Render background workers require Starter or higher tier
    branch: main
    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: ledger-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: ledger-redis
          property: connectionString
