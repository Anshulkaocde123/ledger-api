# ==============================================================================
# Render Infrastructure-as-Code Blueprint (render.yaml)
# 100% Free Tier Compatible ($0/month)
# Declares:
#   1. Managed PostgreSQL database (Postgres 16, free tier, user: ledger_user)
#   2. Managed Redis instance (Key Value, free tier, noeviction)
#   3. Dockerized Express Web API (free tier, runs migrations & embedded worker on boot)
# ==============================================================================

databases:
  - name: ledger-postgres
    databaseName: ledger_db
    user: ledger_user # 'postgres' is reserved on Render; 'ledger_user' is valid
    region: oregon
    plan: free # 100% Free tier database
    postgresMajorVersion: 16

services:
  # ----------------------------------------------------------------------------
  # 1. Managed Redis (Key Value Store) for Balance Caching, Rate Limiting & Queue
  # ----------------------------------------------------------------------------
  - type: redis
    name: ledger-redis
    region: oregon
    plan: free # 100% Free tier Redis instance
    ipAllowList: [] # Restrict network access exclusively to internal Render services
    maxmemoryPolicy: noeviction # Critical for BullMQ: prevents premature eviction of jobs & streams

  # ----------------------------------------------------------------------------
  # 2. Main Web API Service (Node.js / Express inside Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: ledger-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free # 100% Free tier web service
    branch: main
    healthCheckPath: /api/v1/health

    # Note: On Render free tier, preDeployCommand is not supported.
    # Migrations and the embedded BullMQ audit worker execute automatically
    # via the Docker container entrypoint (node src/database/migrate.js && node src/server.js).

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: START_WORKER
        value: "true" # Runs embedded BullMQ queue consumer inside web process for $0 cost

      # Dynamic environment wiring from managed infrastructure
      - key: DATABASE_URL
        fromDatabase:
          name: ledger-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: ledger-redis
          property: connectionString

      # Cryptographically secure 256-bit random keys auto-generated by Render upon provisioning
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # ----------------------------------------------------------------------------
  # Optional: Dedicated Background Worker Process (Paid Starter Plan)
  # Uncomment this service if you upgrade to Render Starter plan ($7/mo)
  # to decouple the worker process into its own isolated container.
  # When enabling this, change START_WORKER on the web service to "false".
  # ----------------------------------------------------------------------------
  # - type: worker
  #   name: ledger-audit-worker
  #   runtime: docker
  #   dockerfilePath: ./Dockerfile
  #   dockerContext: .
  #   dockerCommand: node src/worker.js
